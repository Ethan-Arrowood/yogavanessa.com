<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%title%%</title>
    <link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main_style.css">
    %%header%%
</head>
<body class="page-standard">

<nav>
    <div class="container">
        <a href="/" class="logo">
            <img src="logo.png" alt="Blissful Life">
        </a>
        <button class="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        %%menu%%
    </div>
</nav>

<section class="page-header" role="img" aria-label="Golden aspen trees reaching toward blue sky">
    <div class="page-header-content">
        <h1>%%title%%</h1>
    </div>
</section>

<main class="wsite-content page-content">
    <div class="container">
        %%content%%
    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-links">
            %%menu%%
        </div>
        <p>%%footer%%</p>
    </div>
</footer>

<script src="theme.js"></script>
%%footer_scripts%%
</body>
</html>
